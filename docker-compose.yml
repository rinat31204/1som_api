version: "3.9"

services:

  api:
    build: .
    container_name: som_api
    ports:
      - "${APP_PORT}:${APP_PORT}"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    secrets:
      - firebase-key
    volumes:
      - ./secrets:/secrets

  postgres:
    image: postgres:16-alpine
    container_name: som_postgres
    restart: always
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 10

secrets:
  firebase-key:
    file: ./secrets/298d0-fbsvc-e11b1c9f2b.json

volumes:
  pgdata:
